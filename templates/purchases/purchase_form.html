{% extends 'base.html' %}

{% block header_title %}Create Purchase Order{% endblock %}

{% block content %}
<div class="row justify-content-center pt-4">
    <div class="col-md-6">
        <div class="card card-custom p-4">
            <h4 class="fw-bold text-light mb-4">Stock Procurement & Purchase Order</h4>
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label text-muted small fw-semibold">Select Supplier *</label>
                    <select name="supplier" class="form-select" required>
                        {% for s in suppliers %}
                        <option value="{{ s.id }}">{{ s.company_name }} ({{ s.contact_name }})</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label text-muted small fw-semibold">Select Product to Procure *</label>
                    <select name="product" class="form-select" required>
                        {% for p in products %}
                        <option value="{{ p.id }}">{{ p.name }} (Cost: {{ currency_symbol }}{{ p.purchase_price }})</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="row g-2 mb-3">
                    <div class="col-6">
                        <label class="form-label text-muted small fw-semibold">Quantity Purchased *</label>
                        <input type="number" name="quantity" class="form-control" min="1" value="10" required>
                    </div>
                    <div class="col-6">
                        <label class="form-label text-muted small fw-semibold">Unit Cost ({{ currency_symbol }}) *</label>
                        <input type="number" name="unit_cost" class="form-control" step="0.01" required>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label text-muted small fw-semibold">Payment Status</label>
                    <select name="payment_status" class="form-select">
                        <option value="PAID">Paid Immediately</option>
                        <option value="UNPAID">Unpaid (Add to Supplier Balance)</option>
                    </select>
                </div>
                <div class="d-flex justify-content-between pt-3 border-top border-secondary">
                    <a href="{% url 'purchases_list' %}" class="btn btn-outline-secondary">Cancel</a>
                    <button type="submit" class="btn btn-primary fw-bold px-4">Submit Purchase Order</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
