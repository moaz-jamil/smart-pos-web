{% extends 'base.html' %}

{% block header_title %}Record Stock Movement{% endblock %}

{% block content %}
<div class="row justify-content-center pt-4">
    <div class="col-md-6">
        <div class="card card-custom p-4">
            <h4 class="fw-bold text-light mb-4">Stock Adjustment & Transfer</h4>
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label text-muted small fw-semibold">Select Product *</label>
                    <select name="product" class="form-select" required>
                        {% for p in products %}
                        <option value="{{ p.id }}">{{ p.name }} (Current Stock: {{ p.stock_quantity }})</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label text-muted small fw-semibold">Movement Type *</label>
                    <select name="movement_type" class="form-select" required>
                        <option value="IN">Stock In (Increase Quantity)</option>
                        <option value="OUT">Stock Out (Decrease Quantity)</option>
                        <option value="ADJUSTMENT">Stock Adjustment</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label text-muted small fw-semibold">Quantity *</label>
                    <input type="number" name="quantity" class="form-control" min="1" required>
                </div>
                <div class="mb-3">
                    <label class="form-label text-muted small fw-semibold">Reference Number / Batch No</label>
                    <input type="text" name="reference_number" class="form-control" placeholder="e.g. PO-90021">
                </div>
                <div class="mb-3">
                    <label class="form-label text-muted small fw-semibold">Notes / Reason</label>
                    <textarea name="notes" class="form-control" rows="2" placeholder="e.g. Received new shipment from supplier"></textarea>
                </div>
                <div class="d-flex justify-content-between pt-3 border-top border-secondary">
                    <a href="{% url 'inventory_list' %}" class="btn btn-outline-secondary">Cancel</a>
                    <button type="submit" class="btn btn-primary fw-bold px-4">Submit Movement</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
