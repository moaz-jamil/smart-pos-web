{% extends 'base.html' %}

{% block header_title %}Business & POS System Settings{% endblock %}

{% block content %}
<div class="row justify-content-center pt-4">
    <div class="col-lg-8">
        <div class="card card-custom p-4">
            <h4 class="fw-bold text-light mb-4">Business Configuration Settings</h4>
            <form method="post">
                {% csrf_token %}
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label text-muted small fw-semibold">Currency Symbol *</label>
                        <input type="text" name="currency_symbol" class="form-control" value="{{ setting.currency_symbol }}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label text-muted small fw-semibold">Tax Registration Number</label>
                        <input type="text" name="tax_number" class="form-control" value="{{ setting.tax_number }}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label text-muted small fw-semibold">Default Tax Rate (%)</label>
                        <input type="number" name="tax_rate" class="form-control" step="0.01" value="{{ setting.tax_rate }}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label text-muted small fw-semibold">Low Stock Threshold Level</label>
                        <input type="number" name="low_stock_threshold" class="form-control" value="{{ setting.low_stock_threshold }}">
                    </div>
                    <div class="col-12">
                        <label class="form-label text-muted small fw-semibold">Receipt Header Message</label>
                        <textarea name="receipt_header" class="form-control" rows="2">{{ setting.receipt_header }}</textarea>
                    </div>
                    <div class="col-12">
                        <label class="form-label text-muted small fw-semibold">Receipt Footer Message</label>
                        <textarea name="receipt_footer" class="form-control" rows="2">{{ setting.receipt_footer }}</textarea>
                    </div>
                </div>
                <div class="mt-4 pt-3 border-top border-secondary text-end">
                    <button type="submit" class="btn btn-primary fw-bold px-4">Save Configuration</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
