{% extends 'base.html' %}

{% block header_title %}Delete Product Confirmation{% endblock %}

{% block content %}
<div class="row justify-content-center pt-5">
    <div class="col-md-6">
        <div class="card card-custom p-4 text-center">
            <div class="stat-icon danger mx-auto mb-3" style="width: 70px; height: 70px; font-size: 2.5rem;">
                <i class="bi bi-trash"></i>
            </div>
            <h4 class="fw-bold text-light mb-2">Delete Product?</h4>
            <p class="text-muted">Are you sure you want to permanently delete <strong>"{{ product.name }}"</strong> (SKU: {{ product.sku }})?</p>

            <form method="post" class="mt-4">
                {% csrf_token %}
                <a href="{% url 'products_list' %}" class="btn btn-outline-secondary px-4 me-2">Cancel</a>
                <button type="submit" class="btn btn-danger fw-bold px-4">Yes, Delete Product</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
